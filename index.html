<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Backgammon Roguelike</title>
  </head>
  <body>
    <div id="stage"></div>

    <div id="hud" hidden>
      <div class="row">
        <span id="turn"></span>
        <span id="dice"></span>
        <span id="message"></span>
        <div id="opponent-hand" role="img"></div>
        <div id="players"></div>
      </div>
      <div class="row bottom">
        <div class="buttons">
          <button id="roll" type="button">Roll <kbd>Space</kbd></button>
          <button id="end" type="button">End turn <kbd>E</kbd></button>
          <button id="sound" type="button"></button>
          <button
            id="chat-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="chat-panel"
            hidden
          ></button>
        </div>
        <div id="hand"></div>
      </div>
    </div>

    <!-- Hexes, wards, boons and traps lying on the table at each player's edge of the board. -->
    <div id="table" role="group" aria-label="Cards on the table"></div>

    <!-- Outside the HUD, whose layer sits under the coach: a notice is always seen. -->
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <!-- A sprung trap or a biting hex, turned up over the board. -->
    <div id="reveal" role="status" aria-live="polite"></div>

    <div id="coach" hidden>
      <div id="coach-tag" aria-hidden="true"></div>
      <div id="coach-card" role="status" aria-live="polite">
        <p id="coach-kicker"></p>
        <h2 id="coach-title"></h2>
        <p id="coach-body"></p>
        <button id="coach-begin" type="button" hidden>Begin</button>
        <p id="coach-hint">Click or press any key to dismiss</p>
        <button id="coach-never" type="button">Don't show guides again</button>
        <span id="coach-timer"></span>
      </div>
    </div>

    <div
      id="gameover"
      role="dialog"
      aria-modal="true"
      aria-labelledby="result"
      tabindex="-1"
      hidden
    >
      <div class="go-backdrop"></div>
      <canvas class="go-sparks"></canvas>
      <div class="go-stack">
        <div class="go-crest">
          <div class="go-rays"></div>
          <div class="go-line"></div>
          <div class="go-ring"></div>
          <div class="go-art"></div>
          <div class="go-flash"></div>
        </div>
        <h2 id="result">Game over</h2>
        <div class="go-ribbon">
          <p class="go-headline"></p>
          <p class="go-motto"></p>
        </div>
        <p id="score"></p>
        <div class="go-actions">
          <button id="rematch" type="button">Rematch</button>
          <button id="leave" type="button" class="quiet">Leave game</button>
          <p id="rematch-status" class="quiet" role="status" aria-live="polite"></p>
        </div>
      </div>
      <div class="go-bars"><i></i><i></i></div>
    </div>

    <div id="opponent-away" hidden>
      <span class="away-dot" aria-hidden="true"></span>
      <div class="away-copy">
        <strong id="away-title"></strong>
        <span id="away-detail"></span>
      </div>
      <button id="claim-victory" type="button" hidden>Claim victory</button>
      <span id="away-bar" aria-hidden="true"></span>
    </div>
    <!-- Kept mounted outside the hidden banner so assistive tools reliably announce the first change. -->
    <div id="away-announce" class="sr-only" role="status" aria-live="polite"></div>

    <div id="offline" role="alert" hidden>
      <span class="pulse"></span>
      <span>Connection lost. Reconnecting…</span>
    </div>

    <!-- Outside the HUD and above the result screen, so a rematch can be talked over. -->
    <section id="chat-panel" aria-labelledby="chat-title" hidden>
      <header>
        <h2 id="chat-title">Chat</h2>
        <button id="chat-close" type="button" aria-label="Close chat">&times;</button>
      </header>
      <ol id="chat-log" role="log" aria-live="polite"></ol>
      <p id="chat-empty">Nothing said yet. Say hello.</p>
      <form id="chat-form">
        <input
          id="chat-input"
          type="text"
          autocomplete="off"
          enterkeyhint="send"
          placeholder="Say something…"
          aria-label="Message"
        />
        <button type="submit">Send</button>
      </form>
    </section>
    <button id="chat-preview" type="button" hidden></button>

    <div id="offer" class="overlay" hidden>
      <div class="panel wide">
        <h2>Pick a card</h2>
        <div id="offer-cards"></div>
      </div>
    </div>

    <div id="lobby" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
